<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cube Jumper - Essential Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap');
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: 'Outfit', sans-serif; color: #fff; }
        #auth-overlay { position: fixed; inset: 0; background: #0a0a0a; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .auth-card { background: #111; padding: 30px; border: 1px solid #222; border-radius: 8px; width: 320px; text-align: center; }
        .auth-card h2 { font-weight: 900; letter-spacing: 2px; color: #00e5ff; margin-bottom: 20px; }
        .auth-card input { width: 100%; padding: 12px; margin-bottom: 10px; background: #000; border: 1px solid #333; color: #fff; box-sizing: border-box; outline: none; border-radius: 4px; }
        .auth-btn { width: 100%; padding: 12px; margin-bottom: 8px; border: none; font-weight: 900; cursor: pointer; border-radius: 4px; text-transform: uppercase; }
        .primary { background: #00e5ff; color: #000; }
        .secondary { background: transparent; color: #888; border: 1px solid #333; font-size: 11px; }
        #ui { position: absolute; top: 30px; left: 30px; z-index: 100; display: none; }
        .score { font-size: 60px; font-weight: 900; line-height: 1; }
        .vault { color: #00e5ff; font-size: 14px; margin-top: 10px; letter-spacing: 2px; }
        #premium-lock { margin-top: 20px; padding: 15px; border: 1px solid rgba(255,215,0,0.2); background: rgba(255,215,0,0.05); border-radius: 4px; }
        .btn-premium { margin-top: 10px; padding: 10px; background: #ffd700; color: #000; border: none; font-weight: 900; cursor: pointer; display: none; width: 100%; border-radius: 4px; }
        #user-bar { position: absolute; top: 30px; right: 30px; text-align: right; z-index: 100; display: none; }
        .user-mail { font-size: 9px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        .logout-btn { background: none; border: 1px solid #444; color: #444; padding: 5px 12px; cursor: pointer; font-size: 9px; border-radius: 4px; }
        #death-screen { position: fixed; inset: 0; background: rgba(10, 10, 10, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; }
        .final-score { font-size: 120px; font-weight: 900; margin-bottom: 20px; }
        .restart-btn { padding: 15px 40px; background: #fff; color: #000; border: none; font-weight: 900; cursor: pointer; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>CUBE_JUMPER</h2>
            <input type="email" id="email" placeholder="EMAIL">
            <input type="password" id="pass" placeholder="PASSWORD">
            <button class="auth-btn primary" id="btn-login">Connecter</button>
            <button class="auth-btn secondary" id="btn-signup">Créer un compte</button>
            <p id="auth-error" style="font-size:10px; margin-top:10px; color:#ff0055; min-height:12px;"></p>
        </div>
    </div>

    <div id="ui">
        <div class="score" id="score">0</div>
        <div class="vault">VAULT: <span id="bank-val">0</span> Q</div>
        <div id="premium-lock">
            <div style="font-size: 10px; color:#ffd700; font-weight:900;">PREMIUM STATUS</div>
            <div id="progress" style="font-size: 11px; margin-top:5px; color:#666;">PROGRESS: 0%</div>
            <button id="btn-up" class="btn-premium" onclick="window.location.href='https://clebinet.github.io/cube-jumper-premium'">ACCESS PREMIUM</button>
        </div>
    </div>

    <div id="user-bar">
        <div class="user-mail" id="display-mail">---</div>
        <button class="logout-btn" id="btn-logout">DÉCONNEXION</button>
    </div>

    <div id="death-screen">
        <div id="final-score" class="final-score">0</div>
        <button class="restart-btn" onclick="location.reload()">RETRY</button>
    </div>

    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAR690SLNNSFAIiGxS7LtEnzSwFoDfMf24", authDomain: "cube-jumper-677a4.firebaseapp.com", projectId: "cube-jumper-677a4", storageBucket: "cube-jumper-677a4.firebasestorage.app", messagingSenderId: "32364592034", appId: "1:32364592034:web:ecad749686a9b8b8ab10fb" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
        const KEY = 'qubits_prestige_v2'; let bank = 0, currentUser = null, gameStarted = false;

        const AudioEngine = {
            ctx: null,
            start() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.loop(); },
            playNote(freq, type, start, duration, vol) {
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, start);
                gain.gain.setValueAtTime(vol, start); gain.gain.exponentialRampToValueAtTime(0.01, start + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(start); osc.stop(start + duration);
            },
            loop() {
                let tempo = 0.15, step = 0;
                const notes = [261.63, 293.66, 329.63, 392.00];
                setInterval(() => {
                    let time = this.ctx.currentTime;
                    this.playNote(step % 4 === 0 ? 65.41 : 49.00, 'triangle', time, tempo * 0.9, 0.15);
                    if(step % 2 === 0) this.playNote(notes[Math.floor(Math.random() * notes.length)], 'square', time, tempo, 0.05);
                    step++;
                }, tempo * 1000);
            }
        };

        function updateUI() {
            document.getElementById('bank-val').innerText = bank.toLocaleString();
            let prog = Math.min(100, (bank / 100000) * 100);
            document.getElementById('progress').innerText = `PROGRESS: ${prog.toFixed(1)}%`;
            if(bank >= 100000) document.getElementById('btn-up').style.display = 'block';
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const docSnap = await getDoc(doc(db, "users", user.uid));
                bank = docSnap.exists() ? docSnap.data().qubits : 0;
                updateUI();
                document.getElementById('display-mail').innerText = user.email;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('ui').style.display = 'block';
                document.getElementById('user-bar').style.display = 'block';
                if (!gameStarted) { gameStarted = true; AudioEngine.start(); startEssential(); }
            }
        });

        document.getElementById('btn-signup').onclick = async () => {
            const pass = document.getElementById('pass').value;
            const err = document.getElementById('auth-error');
            const hasMin = pass.length >= 12, hasUp = /[A-Z]/.test(pass), hasLo = /[a-z]/.test(pass), hasNum = /[0-9]/.test(pass), hasSpec = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pass);
            if (!(hasMin && hasUp && hasLo && hasNum && hasSpec)) { err.innerText = "MDP INVALIDE : 12 car, Maj, Min, Chiffre, Symbole."; return; }
            try { await createUserWithEmailAndPassword(auth, document.getElementById('email').value, pass); } catch(e) { err.innerText = e.message; }
        };

        document.getElementById('btn-login').onclick = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value);
        document.getElementById('btn-logout').onclick = () => { signOut(auth).then(() => location.reload()); };

        function startEssential() {
            const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x0a0a0a, 5, 40);
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 10);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            const grid = new THREE.GridHelper(200, 40, 0x444444, 0x222222); scene.add(grid);
            const player = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.8), new THREE.MeshStandardMaterial({ color: 0x00e5ff }));
            player.position.y = 0.4; scene.add(player);
            const enemy = new THREE.Mesh(new THREE.BoxGeometry(3,1,1), new THREE.MeshStandardMaterial({ color: 0xff0055 }));
            enemy.position.z = -60; scene.add(enemy);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const light = new THREE.PointLight(0xffffff, 20); scene.add(light);
            let score = 0, speed = 0.6, isDead = false, jumping = false, jumpVel = 0;
            const jump = () => { if(!jumping && !isDead) { jumping = true; jumpVel = 0.5; }};
            window.onkeydown = (e) => { if(e.code==='Space') jump(); };
            window.ontouchstart = jump;
            function animate() {
                if(isDead) return; requestAnimationFrame(animate);
                if(jumping) { player.position.y += jumpVel; jumpVel -= 0.03; if(player.position.y <= 0.4) { player.position.y = 0.4; jumping = false; } }
                enemy.position.z += speed; grid.position.z += speed;
                if(grid.position.z > 5) grid.position.z = 0;
                if(enemy.position.z > 15) {
                    enemy.position.z = -70; score++; bank += 50;
                    setDoc(doc(db, "users", currentUser.uid), { qubits: bank }, { merge: true });
                    document.getElementById('score').innerText = score; updateUI();
                    speed += 0.01;
                }
                if(new THREE.Box3().setFromObject(player).intersectsBox(new THREE.Box3().setFromObject(enemy))) {
                    isDead = true; document.getElementById('final-score').innerText = score;
                    document.getElementById('death-screen').style.display = 'flex';
                }
                light.position.copy(player.position).y += 2; renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
