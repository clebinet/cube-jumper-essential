<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cube Jumper - Essential</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;900&display=swap');
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Outfit', sans-serif; }
        
        /* Texture de grain subtile */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.03; pointer-events: none; z-index: 300;
        }

        #ui { position: absolute; top: 50px; left: 50px; color: #fff; z-index: 10; pointer-events: none; }
        .label { font-size: 11px; font-weight: 200; letter-spacing: 4px; text-transform: uppercase; color: #666; }
        .value { font-size: 48px; font-weight: 900; margin-bottom: 20px; line-height: 1; }

        #shop { position: absolute; bottom: 50px; right: 50px; text-align: right; color: #444; font-size: 11px; letter-spacing: 1px; }

        #terminal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 500;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #term-input { 
            background: none; border: none; color: #fff; font-size: 60px; font-weight: 900;
            text-align: center; outline: none; text-transform: uppercase; width: 80%;
        }

        #death-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; display: none; flex-direction: column; align-items: center; 
            justify-content: center; z-index: 100; color: #fff;
        }
        .death-title { font-size: 80px; font-weight: 900; letter-spacing: -2px; margin: 0; }
        #timer-bar { width: 300px; height: 1px; background: #222; margin: 40px 0; overflow: hidden; }
        #timer-progress { width: 100%; height: 100%; background: #fff; }

        button { 
            background: #fff; border: none; padding: 15px 40px; font-weight: 900; 
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        button:hover { transform: scale(1.05); background: #00e5ff; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="label">NEURAL_SCORE</div>
        <div class="value" id="score">0</div>
        <div class="label">VAULT_TOTAL</div>
        <div class="value" id="bank" style="color:#00e5ff">0</div>
    </div>

    <div id="terminal">
        <input type="text" id="term-input" maxlength="15" spellcheck="false" autocomplete="off">
        <div style="color:#00e5ff; margin-top:20px; letter-spacing:5px; font-size: 10px;">ROOT@SYSTEM_OVERRIDE</div>
    </div>

    <div id="death-screen">
        <h1 class="death-title">HALTED.</h1>
        <div id="timer-bar"><div id="timer-progress"></div></div>
        <button id="btn-revive">RESTORE SESSION (50Q)</button>
        <button id="btn-restart" style="background:none; color:#444; margin-top:20px;">WIPE DATA</button>
    </div>

    <div id="shop">COMMAND_CONSOLE [T]  |  MODS [2] [3]</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SCENE & RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);
        scene.fog = new THREE.Fog(0x020202, 10, 80);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const mainLight = new THREE.SpotLight(0xffffff, 200);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        scene.add(mainLight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.1));

        const followLight = new THREE.PointLight(0x00e5ff, 50, 10);
        scene.add(followLight);

        // --- WORLD ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 2000),
            new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.2, metalness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(2000, 150, 0x111111, 0x0a0a0a);
        grid.position.y = 0.02;
        scene.add(grid);

        // --- PLAYER ---
        const player = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 0.8, 0.8),
            new THREE.MeshStandardMaterial({ 
                color: 0x000000, roughness: 0, metalness: 1,
                emissive: 0x00aaff, emissiveIntensity: 0.2
            })
        );
        player.position.y = 0.4;
        player.castShadow = true;
        scene.add(player);

        // --- OBSTACLE ---
        const obstacle = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 4 })
        );
        obstacle.position.z = -100;
        obstacle.castShadow = true;
        scene.add(obstacle);

        // --- LOGIC ---
        let score = 0, bank = parseInt(localStorage.getItem('qubits_prestige_v2')) || 0;
        let speed = 0.9, timeScale = 1, isPaused = false;
        let jumping = false, jumpVel = 0, jumpCount = 0, maxJumps = 1;
        let gravity = -0.045, lastZ = -100;

        const updateUI = () => {
            document.getElementById('score').innerText = score;
            document.getElementById('bank').innerText = bank;
            localStorage.setItem('qubits_prestige_v2', bank);
        };
        updateUI();

        // --- CONTROLS ---
        const term = document.getElementById('terminal');
        const termInput = document.getElementById('term-input');
        
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 't' && !isPaused) {
                isPaused = true; term.style.display = 'flex'; termInput.focus();
            } else if (e.key === 'Escape' && term.style.display === 'flex') {
                isPaused = false; term.style.display = 'none';
            } else if (e.key === 'Enter' && term.style.display === 'flex') {
                const cmd = termInput.value.toUpperCase();
                if (cmd === "RICH") bank += 5000;
                if (cmd === "MOON") gravity = -0.015;
                updateUI();
                isPaused = false; term.style.display = 'none'; termInput.value = "";
            }

            if (!isPaused && (e.code === 'Space' || e.key === ' ')) {
                if (jumpCount < maxJumps) {
                    jumping = true; 
                    jumpVel = 0.6; // Saut légèrement boosté pour plus de confort
                    jumpCount++;
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (isPaused) return;

            speed *= 1.0018;
            let currentSpeed = speed * timeScale;

            if (jumping) {
                player.position.y += jumpVel * timeScale;
                jumpVel += gravity * timeScale;
                player.rotation.z += 0.1;
                if (player.position.y <= 0.4) {
                    player.position.y = 0.4; jumping = false; jumpCount = 0;
                    player.rotation.set(0,0,0);
                }
            }

            followLight.position.set(player.position.x, player.position.y + 1, player.position.z);

            lastZ = obstacle.position.z;
            obstacle.position.z += currentSpeed;

            if (obstacle.position.z > 20) {
                obstacle.position.z = -120;
                lastZ = -120;
                const isWide = Math.random() > 0.5;
                // FIX: La hauteur max est plafonnée à 3.2 au lieu de 4.5 pour être franchissable
                obstacle.scale.set(isWide ? 4.5 : 0.4, isWide ? 0.4 : 3.2, 1);
                score++; bank += 10; updateUI();
            }

            camera.position.x += (Math.sin(Date.now() * 0.001) * 0.5 - camera.position.x) * 0.05;
            camera.fov = 55 + (speed * 12);
            camera.updateProjectionMatrix();

            // --- FIX COLLISION ---
            if (lastZ <= player.position.z + 0.5 && obstacle.position.z >= player.position.z - 0.5) {
                // Tolérance de 20% sur la hauteur de l'obstacle pour éviter de mourir en frôlant le sommet
                if (player.position.y < (obstacle.scale.y * 0.8)) triggerDeath();
            }

            renderer.render(scene, camera);
        }

        function triggerDeath() {
            isPaused = true;
            document.getElementById('death-screen').style.display = 'flex';
            let start = Date.now();
            const timer = setInterval(() => {
                let p = 100 - ((Date.now() - start) / 5000 * 100);
                document.getElementById('timer-progress').style.width = p + "%";
                if(p <= 0) { clearInterval(timer); location.reload(); }
            }, 16);
            document.getElementById('btn-revive').onclick = () => {
                if(bank >= 50) { 
                    bank -= 50; obstacle.position.z = -120; isPaused = false; 
                    document.getElementById('death-screen').style.display = 'none'; 
                    updateUI(); clearInterval(timer); 
                }
            };
        }

        document.getElementById('btn-restart').onclick = () => location.reload();
        animate();
    </script>
</body>
</html>
